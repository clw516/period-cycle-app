<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#25324a" />
    <title>安裝週期計算 App</title>
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      :root {
        color-scheme: light;
        --ink: #1f2633;
        --muted: #647084;
        --line: #d9e1ec;
        --rose: #e85d75;
        --teal: #0f9f8f;
        --blue: #25324a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
        color: var(--ink);
        font-family: "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
        background: linear-gradient(135deg, rgba(232, 93, 117, 0.14), rgba(15, 159, 143, 0.14)), #eef5f7;
      }

      main {
        width: min(560px, 100%);
        margin: 0 auto;
      }

      .app-icon {
        width: 86px;
        height: 86px;
        border-radius: 24px;
        box-shadow: 0 18px 42px rgba(31, 38, 51, 0.18);
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 1.8rem;
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
      }

      .panel {
        margin-top: 18px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 42px rgba(31, 38, 51, 0.12);
      }

      ol {
        margin: 0;
        padding-left: 20px;
      }

      li {
        margin: 12px 0;
        line-height: 1.6;
      }

      strong {
        color: var(--ink);
      }

      a.button {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        margin-top: 16px;
        border-radius: 8px;
        color: #fff;
        background: var(--blue);
        text-decoration: none;
        font-weight: 900;
      }

      .note {
        margin-top: 14px;
        padding-left: 12px;
        border-left: 4px solid var(--teal);
      }
    </style>
  </head>
  <body>
    <main>
      <img class="app-icon" src="./icons/apple-touch-icon.png" alt="週期計算 App 圖示" />
      <h1>安裝週期計算 App</h1>
      <p>用 Safari 加到 iPhone 主畫面後，就能像一般 App 一樣開啟。首次載入完成後，主要功能可離線使用。</p>

      <section class="panel">
        <ol>
          <li>用 <strong>Safari</strong> 開啟這個網站。</li>
          <li>點下方或上方的 <strong>分享</strong> 按鈕。</li>
          <li>選擇 <strong>加入主畫面</strong>。</li>
          <li>名稱保留「週期計算」，點 <strong>新增</strong>。</li>
        </ol>
        <a class="button" href="./index.html">打開 App</a>
      </section>

      <p class="note">如果沒有看到「加入主畫面」，請確認是用 Safari 開啟，不是 LINE、Instagram 或其他 App 內建瀏覽器。</p>
    </main>
  </body>
</html>
